name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always

jobs:
  # -----------------------------------------------------------------------
  # Daemon-only builds  (lightweight, no GUI — just the binary)
  # -----------------------------------------------------------------------
  daemon-linux:
    name: Daemon · Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxtst-dev libevdev-dev libudev-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - name: Build daemon
        run: cargo build --release -p daemon

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/keymapper-daemon dist/
          cp setup_linux.sh dist/
          cp keymapper.service.template dist/
          tar -czf keymapper-daemon-linux-x86_64.tar.gz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: keymapper-daemon-linux-x86_64
          path: keymapper-daemon-linux-x86_64.tar.gz

  daemon-windows:
    name: Daemon · Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build daemon
        run: cargo build --release -p daemon

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item target\release\keymapper-daemon.exe dist\
          Copy-Item setup_windows.ps1 dist\
          Compress-Archive -Path dist\* -DestinationPath keymapper-daemon-windows-x86_64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: keymapper-daemon-windows-x86_64
          path: keymapper-daemon-windows-x86_64.zip

  # -----------------------------------------------------------------------
  # Draft the release. The editor is a website now, so the only thing to
  # download is the daemon — there is no GUI package to build.
  # -----------------------------------------------------------------------
  draft-release:
    name: Draft release
    needs: [daemon-linux, daemon-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: 'KeyMapper ${{ github.ref_name }}'
          body: |
            ## Downloads

            | Package | Platform |
            |---------|----------|
            | `keymapper-daemon-linux-x86_64.tar.gz` | Linux |
            | `keymapper-daemon-windows-x86_64.zip` | Windows |

            The daemon is all you install. Edit your mappings in the browser —
            it writes straight to the config file and the daemon picks the
            change up immediately.

            **Config file location:** `KeyMapper` in your home folder
            (`~/KeyMapper/config.yaml`). A daemon upgrading from an earlier
            release moves your existing config there on first run.

  # -----------------------------------------------------------------------
  # Attach daemon-only archives to the same draft release
  # -----------------------------------------------------------------------
  attach-daemon-artifacts:
    name: Attach daemon archives to release
    needs: [daemon-linux, daemon-windows, draft-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: keymapper-daemon-linux-x86_64

      - uses: actions/download-artifact@v4
        with:
          name: keymapper-daemon-windows-x86_64

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            keymapper-daemon-linux-x86_64.tar.gz
            keymapper-daemon-windows-x86_64.zip
